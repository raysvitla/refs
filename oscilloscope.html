<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Garden — live oscilloscope</title>
<style>
  :root{--ink:#e7e1cd;--muted:#97a28d;--line:rgba(216,229,194,.19);--panel:#102a1c;--panel-deep:#07170e;--trace:#ff9d72;--trace-hot:#ffe0c8;--acid:#d9ff89}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#080b09;color:var(--ink);font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.02em}
  .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px;gap:14px;background:radial-gradient(ellipse at 50% 8%,#172a1b 0,#080b09 52%)}
  header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1400px;width:100%;margin:auto}.brand{display:flex;gap:10px;align-items:baseline}.brand b{font-size:14px;letter-spacing:.13em}.brand span{color:var(--muted);font-size:11px}.live{color:var(--acid);font-size:11px}.live::before{content:'●';font-size:9px;margin-right:6px;animation:pulse 1.7s infinite}
  .frame{position:relative;max-width:1400px;width:100%;margin:auto;min-height:0;border:1px solid rgba(222,239,198,.44);border-radius:20px;padding:14px;background:linear-gradient(145deg,#244b2f,#0e2518 48%,#061008);box-shadow:0 30px 80px rgba(0,0,0,.48),inset 0 0 0 1px rgba(255,255,255,.06)}
  .screen{position:relative;overflow:hidden;min-height:56vh;height:calc(100vh - 180px);border:1px solid rgba(222,239,198,.29);border-radius:10px;background:radial-gradient(ellipse at center,#275f37 0%,#174026 42%,#0a2315 100%);box-shadow:inset 0 0 70px rgba(0,0,0,.48);isolation:isolate}
  .screen:before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px),radial-gradient(ellipse at center,transparent 46%,rgba(1,11,4,.48));mix-blend-mode:multiply}
  #scope{display:block;width:100%;height:100%;position:relative;z-index:1}.corner{position:absolute;width:25px;height:25px;z-index:4;border-color:#e1f8bd;opacity:.8}.tl{left:13px;top:13px;border-left:2px solid;border-top:2px solid}.tr{right:13px;top:13px;border-right:2px solid;border-top:2px solid}.bl{left:13px;bottom:13px;border-left:2px solid;border-bottom:2px solid}.br{right:13px;bottom:13px;border-right:2px solid;border-bottom:2px solid}
  .hud{position:absolute;z-index:5;left:27px;bottom:25px;display:grid;gap:4px;color:#dff1cb;text-shadow:0 1px 8px #061207;font-size:11px}.hud b{font-size:12px;color:var(--trace-hot)}.meter{position:absolute;right:27px;bottom:25px;z-index:5;color:#dff1cb;font-size:11px;text-align:right}.meter i{display:block;width:112px;height:3px;background:rgba(215,246,197,.16);margin:7px 0 0 auto}.meter i:after{content:'';display:block;width:var(--level,36%);height:100%;background:var(--trace);box-shadow:0 0 10px var(--trace)}
  .controls{position:absolute;z-index:6;top:27px;right:27px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.controls button{appearance:none;border:1px solid rgba(230,241,205,.35);color:#eaffd7;background:rgba(5,17,9,.52);font:inherit;font-size:11px;padding:8px 10px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px)}.controls button:hover,.controls button.active{border-color:var(--acid);color:var(--acid);background:rgba(54,90,29,.42)}
  footer{color:var(--muted);font-size:10px} footer kbd{border:1px solid #536352;border-radius:4px;padding:2px 5px;color:#c7d5bc;font-family:inherit}@keyframes pulse{50%{opacity:.25}}
  @media(max-width:680px){.shell{padding:10px}.screen{height:calc(100vh - 150px);min-height:480px}.controls{left:20px;right:20px;top:auto;bottom:20px;justify-content:flex-start}.hud{left:22px;bottom:105px}.meter{right:22px;bottom:106px}.brand span{display:none}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><b>SIGNAL GARDEN</b><span>audio drawn as a living line</span></div><div class="live" id="modeLabel">demo signal</div></header>
<main class="frame"><section class="screen" aria-label="Audio oscilloscope visualizer"><canvas id="scope"></canvas><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="controls"><button id="demo" class="active">demo tone</button><button id="mic">use mic</button><button id="freeze">freeze</button><button id="save">save frame</button></div><div class="hud"><b id="shape">LISSAJOUS / 05:04</b><span id="tip">move your pointer to bend the field</span></div><div class="meter"><span id="frequency">392 Hz</span><i id="level"></i></div></section></main>
<footer><span>mic input stays in this browser — nothing leaves your machine.</span><span><kbd>space</kbd> pause&nbsp;&nbsp;<kbd>m</kbd> mic&nbsp;&nbsp;<kbd>s</kbd> save</span></footer>
</div>
<script>
(() => {
  const canvas = document.querySelector('#scope'), ctx = canvas.getContext('2d');
  const demo = document.querySelector('#demo'), mic = document.querySelector('#mic'), freeze = document.querySelector('#freeze'), save = document.querySelector('#save');
  const modeLabel = document.querySelector('#modeLabel'), shape = document.querySelector('#shape'), frequency = document.querySelector('#frequency'), level = document.querySelector('#level');
  let audio, analyser, data, source, oscA, oscB, gain, micStream, isFrozen = false, visualMode = 'demo', pointer = {x:.5,y:.5}, t0 = performance.now();
  function resize(){const r=canvas.parentElement.getBoundingClientRect(),d=Math.min(devicePixelRatio,2);canvas.width=r.width*d;canvas.height=r.height*d;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0)}
  addEventListener('resize',resize); resize();
  function initAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)(); analyser=audio.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.76;data=new Uint8Array(analyser.fftSize);gain=audio.createGain();gain.gain.value=.065;gain.connect(analyser);analyser.connect(audio.destination)}
  function stopSource(){if(source){try{source.disconnect()}catch(e){}source=null}if(oscA){oscA.stop();oscB.stop();oscA=null;oscB=null}if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}}
  function startDemo(){initAudio();audio.resume();stopSource();visualMode='demo';modeLabel.textContent='demo signal'; demo.classList.add('active');mic.classList.remove('active');const now=audio.currentTime;oscA=audio.createOscillator();oscB=audio.createOscillator();const mix=audio.createGain();oscA.type='sine';oscB.type='sine';oscA.frequency.setValueAtTime(196,now);oscB.frequency.setValueAtTime(245,now);oscA.detune.setValueAtTime(3,now);oscB.detune.setValueAtTime(-2,now);oscA.connect(mix);oscB.connect(mix);mix.gain.value=.9;mix.connect(gain);oscA.start();oscB.start()}
  async function startMic(){try{initAudio();audio.resume();stopSource();micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});source=audio.createMediaStreamSource(micStream);source.connect(gain);visualMode='mic';modeLabel.textContent='microphone live';demo.classList.remove('active');mic.classList.add('active');shape.textContent='INPUT / LIVE TRACE'}catch(err){modeLabel.textContent='mic permission blocked';startDemo()}}
  function drawGrid(w,h){ctx.save();ctx.strokeStyle='rgba(219,241,191,.17)';ctx.lineWidth=1;const cols=10,rows=8;for(let i=1;i<cols;i++){let x=i*w/cols;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let i=1;i<rows;i++){let y=i*h/rows;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='rgba(219,241,191,.24)';ctx.beginPath();ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.restore()}
  function render(now){requestAnimationFrame(render);if(isFrozen)return;const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);drawGrid(w,h);const elapsed=(now-t0)/1000;let amp=.45;if(analyser){analyser.getByteTimeDomainData(data);let sum=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v}amp=Math.min(.95,Math.sqrt(sum/data.length)*5+.12)}else data=null;level.style.setProperty('--level',Math.round(amp*100)+'%');
    const cx=w/2,cy=h/2,scale=Math.min(w,h)*(.38+amp*.11),xFreq=3+Math.round(pointer.x*3),yFreq=4+Math.round(pointer.y*4);ctx.save();ctx.globalCompositeOperation='screen';for(let layer=0;layer<4;layer++){ctx.beginPath();for(let i=0;i<1300;i++){let u=i/1299*Math.PI*2;let wobble=(visualMode==='mic'&&data)?((data[(i*3)%data.length]-128)/128)*.24:Math.sin(u*17+elapsed*2.3)*.05;let x=Math.sin(u*xFreq+elapsed*.55+wobble)*scale;let y=Math.sin(u*yFreq+elapsed*.77+wobble)*scale;const j=(layer-1.5)*(1.2+amp*2.6);if(i===0)ctx.moveTo(cx+x+j,cy+y-j);else ctx.lineTo(cx+x+j,cy+y-j)}ctx.strokeStyle=layer===3?'rgba(255,225,199,.75)':`rgba(255,143,99,${.10+layer*.08})`;ctx.lineWidth=layer===3?1.15:1.8;ctx.shadowColor='#ff9d72';ctx.shadowBlur=layer===3?14:7;ctx.stroke()}ctx.restore();frequency.textContent=visualMode==='mic'?'input level':`${Math.round(196+amp*392)} Hz`;shape.textContent=`LISSAJOUS / ${String(xFreq).padStart(2,'0')}:${String(yFreq).padStart(2,'0')}`}
  canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width;pointer.y=(e.clientY-r.top)/r.height});demo.onclick=startDemo;mic.onclick=startMic;freeze.onclick=()=>{isFrozen=!isFrozen;freeze.classList.toggle('active',isFrozen);freeze.textContent=isFrozen?'unfreeze':'freeze'};save.onclick=()=>{const a=document.createElement('a');a.download='signal-garden.png';a.href=canvas.toDataURL('image/png');a.click()};addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();freeze.click()}if(e.key.toLowerCase()==='m')startMic();if(e.key.toLowerCase()==='s')save.click()});startDemo();requestAnimationFrame(render);
})();
</script>
</body>
</html>
